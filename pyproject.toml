[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-coding"
version = "0.1.0"
description = "Python implementation of the llm-coding project"
authors = [{name = "Anomaly"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.28.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "pre-commit",
]

[project.scripts]
llm-up = "llm_coding.cli:main"
llm-down = "llm_coding.cli:main"
llm-status = "llm_coding.cli:main"
llm-doctor = "llm_coding.cli:main"
opencode-runpod = "llm_coding.cli:main"
llm-install = "llm_coding.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_coding*"]

[tool.setuptools.package-dir]
"" = "build/lib"

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = [
    "A",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "EXE",
    "F",
    "G",
    "I",
    "ICN",
    "ISC",
    "N",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PYI",
    "RUF",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "PLR",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
