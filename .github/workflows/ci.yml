name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Create repository virtual environment
        run: python -m venv .venv
      - name: Install lint dependencies
        run: .venv/bin/python -m pip install -r requirements.txt
      - name: Run pre-commit
        run: .venv/bin/pre-commit run --all-files

  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Create repository virtual environment
        run: python -m venv .venv
      - name: Install test dependencies
        run: .venv/bin/python -m pip install -r requirements.txt -e .
      - name: Run unit tests
        run: .venv/bin/python -m unittest discover -s python-src/tests

  static-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell and configuration assets
        run: bash tests/static-checks.sh

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Create repository virtual environment
        run: python -m venv .venv
      - name: Install build frontend
        run: .venv/bin/python -m pip install build
      - name: Build wheel and source distribution
        run: .venv/bin/python -m build
      - name: Install wheel in a clean environment
        run: |
          .venv/bin/python -m venv /tmp/llm-coding-wheel
          /tmp/llm-coding-wheel/bin/python -m pip install dist/*.whl
      - name: Invoke installed console commands harmlessly
        run: |
          for command in \
            llm-up llm-down llm-status llm-doctor llm-install \
            llm-runtime opencode-runpod; do
            /tmp/llm-coding-wheel/bin/"$command" --help >/dev/null
          done
      - name: Select unsupported Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify Python 3.10 is rejected
        run: |
          if python -m pip install --no-deps dist/*.whl; then
            echo 'Wheel unexpectedly supports Python 3.10.' >&2
            exit 1
          fi

  docker-changes:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            runtime:
              - 'docker/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  docker:
    needs: docker-changes
    if: needs.docker-changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image without pushing
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: false
          tags: llm-coding-runtime:ci
