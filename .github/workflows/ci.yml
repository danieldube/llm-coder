name: CI

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install checks
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Run static checks
        run: ./tests/static-checks.sh
