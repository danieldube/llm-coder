name: Publish CUDA 12.8 runtime image

on:
  push:
    branches:
      - main
    paths:
      - 'docker/Dockerfile.cuda128'
      - 'docker/start-vllm.sh'
      - 'docker/validate-runtime.cuda128'
      - 'docker/verify-vllm-cu128-wheel.py'
      - '.dockerignore'
      - '.github/workflows/publish-cuda128-runtime-image.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional immutable image tag suffix (defaults to commit SHA)'
        required: false
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-cuda128-runtime-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-runtime
  WHEEL_RELEASE: vllm-cu128-wheel-0.28.0-2cf0a6915ce544dc493a0990f2ea38d81601128a-torch2.13.0-linux-amd64

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download immutable CUDA 12.8 wheel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wheel_dir=docker/vllm-cu128-wheel
          find "$wheel_dir" -mindepth 1 -maxdepth 1 -type f -delete
          gh release download "$WHEEL_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.whl' \
            --pattern 'vllm-cu128-wheel-manifest.json' \
            --dir "$wheel_dir"
          test "$(find "$wheel_dir" -maxdepth 1 -name '*.whl' -type f | wc -l)" = 1
          test -f "$wheel_dir/vllm-cu128-wheel-manifest.json"

      - name: Verify wheel release manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          directory = Path('docker/vllm-cu128-wheel')
          manifest = json.loads(
              (directory / 'vllm-cu128-wheel-manifest.json').read_text()
          )
          wheels = list(directory.glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit('Expected exactly one CUDA 12.8 wheel')
          wheel = wheels[0]
          if manifest.get('wheel_filename') != wheel.name:
              raise SystemExit('Wheel filename does not match manifest')
          actual = hashlib.sha256(wheel.read_bytes()).hexdigest()
          if manifest.get('wheel_sha256') != actual:
              raise SystemExit('Wheel SHA256 does not match manifest')
          required = {
              'vllm_version': '0.28.0',
              'vllm_commit': '2cf0a6915ce544dc493a0990f2ea38d81601128a',
              'torch_version': '2.13.0',
              'torch_cuda': '12.8',
              'target_platform': 'linux/amd64',
              'architectures': ['8.9', '9.0', '12.0'],
          }
          for key, value in required.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'Unexpected wheel manifest value: {key}')
          PY

      - name: Select immutable candidate tag
        id: image
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-sha-${GITHUB_SHA::12}}"
          case "$tag" in
            ''|*[^0-9A-Za-z._-]*)
              echo 'Image tag must contain only letters, numbers, ., _, or -.' >&2
              exit 1
              ;;
          esac
          echo "candidate=cuda128-${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cuda128
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.candidate }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.candidate }}

      - name: Validate candidate software contract
        env:
          CANDIDATE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.candidate }}
        run: |
          docker pull "$CANDIDATE"
          docker run --rm --entrypoint /usr/local/bin/validate-runtime "$CANDIDATE"
          docker run --rm --entrypoint /bin/bash "$CANDIDATE" -c \
            'test -x /opt/llm-coding/bin/start-vllm.sh'

      - name: Attest candidate provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Promote validated candidate to stable alias
        env:
          CANDIDATE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.candidate }}
          STABLE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cuda128
        run: docker buildx imagetools create --tag "$STABLE" "$CANDIDATE"
