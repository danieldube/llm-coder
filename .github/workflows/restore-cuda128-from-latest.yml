name: Restore CUDA 12.8 fallback from latest

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/restore-cuda128-from-latest.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: restore-cuda128-fallback-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-runtime

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify rollback source
        run: docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:latest"

      - name: Restore CUDA 12.8 fallback alias
        run: |
          docker buildx imagetools create \
            --tag "$REGISTRY/$IMAGE_NAME:cuda128" \
            "$REGISTRY/$IMAGE_NAME:latest"
